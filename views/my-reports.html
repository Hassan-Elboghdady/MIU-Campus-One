<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reports - CampusOne</title>
  <meta name="description" content="View and track all of your campus maintenance reports submitted through CampusOne.">
  <meta name="theme-color" content="#B80008">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../public/favicon.svg">
  <link rel="icon" type="image/x-icon" href="../public/favicon.ico">
  <link rel="apple-touch-icon" href="../public/apple-touch-icon.png">
  <link rel="stylesheet" href="../public/css/style.css">
  <link rel="stylesheet" href="../public/css/profile.css">
  <link rel="stylesheet" href="../public/css/student.css">
  <link rel="stylesheet" href="../public/css/my-reports.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header></header>
  <main id="main">
    <div class="container page-container">

      <!-- List view -->
      <div id="list-view">
        <div class="page-header-row">
          <div class="page-title-block">
            <h1 class="page-title">My reports</h1>
            <p class="page-subtitle">Track and view the progress of maintenance problems you have reported across campus.</p>
          </div>
          <a href="report.html" class="btn btn-primary" id="list-report-btn">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <line x1="8" y1="3" x2="8" y2="13"/>
              <line x1="3" y1="8" x2="13" y2="8"/>
            </svg>
            Report an issue
          </a>
        </div>
        <div class="list-controls" role="group" aria-label="Filter reports by status">
          <button type="button" class="filter-btn is-active" data-filter="all" id="filter-all">All</button>
          <button type="button" class="filter-btn" data-filter="submitted" id="filter-submitted">Submitted</button>
          <button type="button" class="filter-btn" data-filter="assigned" id="filter-assigned">Assigned</button>
          <button type="button" class="filter-btn" data-filter="in_progress" id="filter-in-progress">In progress</button>
          <button type="button" class="filter-btn" data-filter="resolved" id="filter-resolved">Resolved</button>
        </div>
        <div id="reports-list-container" aria-live="polite" aria-atomic="true"></div>
      </div>

      <!-- Details view -->
      <div id="details-view" hidden>
        <div class="page-title-block details-title-block">
          <a href="my-reports.html" class="back-link" id="back-to-list-link">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M11 4L5 9l6 5"/>
            </svg>
            Back to my reports
          </a>
          <h1 class="page-title" id="details-title">Report details</h1>
        </div>
        <div id="details-container" aria-live="polite" aria-atomic="true"></div>
      </div>

    </div>
  </main>
  <footer id="site-footer"></footer>

  <!-- Image viewer dialog -->
  <dialog id="image-viewer-dialog" class="image-viewer-dialog" aria-label="Image viewer" aria-modal="true">
    <div class="image-viewer-inner">
      <button type="button" class="image-viewer-close" id="image-viewer-close" aria-label="Close image viewer">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" focusable="false">
          <line x1="4" y1="4" x2="18" y2="18"/>
          <line x1="18" y1="4" x2="4" y2="18"/>
        </svg>
      </button>
      <img id="image-viewer-img" src="" alt="" class="image-viewer-img">
    </div>
  </dialog>

  <script type="module" src="../public/js/my-reports.js"></script>
</body>
</html>
