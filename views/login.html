<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusOne</title>
  <meta name="description" content="Log in to CampusOne with your Misr International University email to access the campus map, maintenance reports and Lost &amp; Found.">
  <meta name="theme-color" content="#B80008">
  <link rel="icon" type="image/svg+xml" href="../public/favicon.svg">
  <link rel="icon" type="image/x-icon" href="../public/favicon.ico">
  <link rel="apple-touch-icon" href="../public/apple-touch-icon.png">
  <meta property="og:title" content="Login - CampusOne">
  <meta property="og:description" content="Log in to CampusOne, the campus app for Misr International University.">
  <meta property="og:image" content="../public/images/logo.png">
  <link rel="stylesheet" href="../public/css/style.css">
  <link rel="stylesheet" href="../public/css/auth.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main" class="auth-page">

    <!-- Left: image panel -->
    <div class="auth-side" aria-hidden="true">
      <img src="../public/images/campus_hero.png" alt="" class="auth-side__img">
      <div class="auth-side__content">
        <div class="auth-side__logo">
          <img src="../public/images/logo.png" alt="MIU logo" width="44" height="44">
          <span style="font-weight:800;font-size:20px;color:#fff;">CampusOne</span>
        </div>
        <h2 class="auth-side__title">Your campus,<br>all in one place.</h2>
        <p class="auth-side__sub">Navigate the MIU campus, report maintenance issues and manage Lost &amp; Found - all from one secure login.</p>
      </div>
    </div>

    <!-- Right: login form -->
    <div class="auth-main">
      <div class="auth-card">

        <div class="auth-logo">
          <img src="../public/images/logo.png" alt="Misr International University logo" width="56" height="56">
        </div>

        <h1 class="auth-heading">Welcome back</h1>
        <p class="auth-subtext">Log in with your MIU university email address.</p>

        <div id="login-summary-error" class="alert alert-error" role="alert" aria-live="assertive"></div>

        <form id="login-form" class="auth-form" novalidate>

          <div class="form-group">
            <label for="login-email" class="form-label">
              University email
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <input
              type="email"
              id="login-email"
              name="email"
              class="form-input"
              autocomplete="email"
              required
              aria-describedby="login-email-error"
              placeholder="yourname@miu.edu.eg">
            <span id="login-email-error" class="form-error" role="alert"></span>
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label">
              Password
              <span class="required-mark" aria-hidden="true">*</span>
            </label>
            <div class="password-wrapper">
              <input
                type="password"
                id="login-password"
                name="password"
                class="form-input"
                autocomplete="current-password"
                required
                aria-describedby="login-password-error">
              <button type="button" id="login-pass-toggle" class="password-toggle" aria-label="Show password">
                <svg class="icon-eye" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M1 9s3-5 8-5 8 5 8 5-3 5-8 5-8-5-8-5z"/><circle cx="9" cy="9" r="2"/>
                </svg>
                <svg class="icon-eye-off visually-hidden" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                  <path d="M1 1l16 16M7.5 7.6A2 2 0 0 0 10.4 10.5M5.2 5.2C3 6.5 1 9 1 9s3 5 8 5a8.7 8.7 0 0 0 3.8-.9M9 4c4.1.5 6.5 3.6 7 5a11 11 0 0 1-1.3 2"/>
                </svg>
              </button>
            </div>
            <span id="login-password-error" class="form-error" role="alert"></span>
          </div>

          <div class="auth-links">
            <label class="form-checkbox-group">
              <input type="checkbox" id="login-remember" name="remember" class="form-checkbox">
              <span>Remember me</span>
            </label>
            <a href="forgot-password.html" id="forgot-password-link">Forgot password?</a>
          </div>

          <button type="submit" id="login-submit" class="btn btn-primary btn-lg">Login</button>

        </form>

        <div class="auth-links" style="justify-content:center;margin-block-start:var(--space-5);">
          <a href="index.html" id="back-to-home-link">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:inline;vertical-align:middle;">
              <polyline points="9,2 4,7 9,12"/>
            </svg>
            Back to home
          </a>
        </div>

        <div class="auth-back-link">
          <a href="register.html" id="go-to-register-link">New student? Create an account</a>
        </div>

        <div id="dev-hint" class="dev-hint" aria-label="Developer test accounts"></div>

      </div>
    </div>

  </main>

  <script>
    // Plain script — works on file:// (no ES module restrictions)
    (function () {
      // Mock accounts (same as common.js MOCK_USERS)
      var MOCK_USERS = [
        { id:'u1', name:'Ahmed Nasser',      email:'student@miu.edu.eg',      password:'student123',  role:'student',          studentId:'MIU-20220001', faculty:'Engineering' },
        { id:'u2', name:'Sara Mahmoud',      email:'supervisor@miu.edu.eg',   password:'super123',    role:'supervisor',       studentId:null, faculty:null },
        { id:'u3', name:'Omar Khaled',       email:'tech@miu.edu.eg',         password:'tech123',     role:'technician',       studentId:null, faculty:null },
        { id:'u4', name:'Nour El-Din Fawzy', email:'lostandfound@miu.edu.eg', password:'lf123',       role:'lost-found-staff', studentId:null, faculty:null },
        { id:'u5', name:'Admin User',        email:'admin@miu.edu.eg',        password:'admin123',    role:'admin',            studentId:null, faculty:null },
      ];
      var ROLE_HOME = { student:'home.html', supervisor:'staff.html', technician:'maintenance.html', 'lost-found-staff':'staff-lost-found.html', admin:'admin.html' };

      function findUser(email, password) {
        var lower = email.toLowerCase().trim();
        // Check mock users first
        var mock = MOCK_USERS.find(function (u) { return u.email.toLowerCase() === lower; });
        if (mock && mock.password === password) return mock;
        // Check registered users from localStorage
        try {
          var registered = JSON.parse(localStorage.getItem('campusone_registered_users') || '[]');
          var reg = registered.find(function (u) { return u.email.toLowerCase() === lower; });
          if (reg && reg.password === password) return reg;
        } catch (e) {}
        return null;
      }

      // Password toggle
      var passInput  = document.getElementById('login-password');
      var passToggle = document.getElementById('login-pass-toggle');
      if (passToggle && passInput) {
        passToggle.addEventListener('click', function () {
          var show = passInput.type === 'password';
          passInput.type = show ? 'text' : 'password';
          passToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
          var eye    = passToggle.querySelector('.icon-eye');
          var eyeOff = passToggle.querySelector('.icon-eye-off');
          if (eye)    eye.classList.toggle('visually-hidden', show);
          if (eyeOff) eyeOff.classList.toggle('visually-hidden', !show);
        });
      }

      // Form submit
      var form       = document.getElementById('login-form');
      var emailInput = document.getElementById('login-email');
      var summaryEl  = document.getElementById('login-summary-error');
      var submitBtn  = document.getElementById('login-submit');

      if (form) {
        form.addEventListener('submit', function (e) {
          e.preventDefault();
          summaryEl.textContent = '';

          var email    = emailInput ? emailInput.value.trim() : '';
          var password = passInput  ? passInput.value         : '';

          if (!email || !password) {
            summaryEl.textContent = 'Please enter your email and password.';
            return;
          }

          submitBtn.disabled = true;
          submitBtn.textContent = 'Signing in…';

          setTimeout(function () {
            var user = findUser(email, password);
            if (!user) {
              summaryEl.textContent = 'Incorrect email or password. Please try again.';
              submitBtn.disabled = false;
              submitBtn.textContent = 'Login';
              return;
            }

            // Save session (no password stored)
            var session = { id:user.id, name:user.name, email:user.email, role:user.role, studentId:user.studentId||null, faculty:user.faculty||null };
            try { localStorage.setItem('campusone_session', JSON.stringify(session)); } catch (err) {}

            // Redirect to role home
            window.location.replace(ROLE_HOME[user.role] || 'home.html');
          }, 300);
        });
      }
    })();
  </script>
</body>
</html>
